<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="920" height="200">
  <defs>
    <linearGradient id="brand-emblem-grad" x1="4" y1="4" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" />
      <stop offset="0.5" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="brand-rx-grad" x1="14" y1="12" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="0.6" stop-color="#a7f3d0" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="brand-bg-grad" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="1" stop-color="#022c22" />
    </linearGradient>
    <filter id="brand-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Group Emblem translated to (14, 14) -->
  <g transform="translate(14, 14)">
    <rect width="72" height="72" rx="20" fill="url(#brand-bg-grad)" />
    <rect width="72" height="72" rx="20" fill="none" stroke="url(#brand-emblem-grad)" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="30" cy="27" r="21" fill="#34d399" fill-opacity="0.12" />
    <circle cx="36" cy="36" r="27" stroke="url(#brand-emblem-grad)" stroke-width="2.5" stroke-dasharray="5 3" stroke-opacity="0.75" />

    <!-- 'R' Stem & Loop -->
    <path
      d="M23 20V52M23 21H37C41.5 21 45 24.5 45 29C45 33.5 41.5 37 37 37H23"
      stroke="url(#brand-rx-grad)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#brand-glow)"
    />
    <!-- 'x' diagonal tail -->
    <path
      d="M33 36L49.5 52.5"
      stroke="url(#brand-rx-grad)"
      stroke-width="4.5"
      stroke-linecap="round"
      filter="url(#brand-glow)"
    />
    <!-- 'x' cross stroke -->
    <path
      d="M36 51L47 40"
      stroke="#5eead4"
      stroke-width="3.8"
      stroke-linecap="round"
    />

    <!-- Glowing dot -->
    <circle cx="51" cy="21" r="4.8" fill="#34d399" filter="url(#brand-glow)" />
    <circle cx="51" cy="21" r="2" fill="#ffffff" />
  </g>

  <!-- Typography: Theprescription -->
  <g transform="translate(106, 52)">
    <!-- Wordmark text -->
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8">
      <tspan fill="#0f172a">The</tspan>
      <tspan fill="#059669">prescription</tspan>
    </text>

    <!-- Tag Badge -->
    <g transform="translate(262, -26)">
      <rect width="52" height="24" rx="6" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1" />
      <text x="26" y="16" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#065f46" text-anchor="middle" letter-spacing="0.5">Rx AI</text>
    </g>

    <!-- Subtitle -->
    <text x="2" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748b" letter-spacing="0.2">
      Clinical Handwriting Deciphering &amp; Safety
    </text>
  </g>
</svg>
