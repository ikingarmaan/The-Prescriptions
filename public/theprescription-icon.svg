<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <defs>
    <linearGradient id="emblem-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" />
      <stop offset="0.5" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="rx-grad" x1="14" y1="12" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="0.6" stop-color="#a7f3d0" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="1" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="48" height="48" rx="14" fill="url(#bg-grad)" />
  <rect width="48" height="48" rx="14" fill="none" stroke="url(#emblem-grad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Subtle ambient glow circle -->
  <circle cx="20" cy="18" r="14" fill="#34d399" fill-opacity="0.12" />

  <!-- Outer precision lens dashed ring -->
  <circle
    cx="24"
    cy="24"
    r="18"
    stroke="url(#emblem-grad)"
    stroke-width="1.8"
    stroke-dasharray="3.5 2"
    stroke-opacity="0.75"
  />

  <!-- Stylized Modern 'Rx' + Medical Cross Fusion -->
  <!-- 'R' Stem & Loop -->
  <path
    d="M15 13V35M15 14H24.5C27.5 14 30 16.5 30 19.5C30 22.5 27.5 25 24.5 25H15"
    stroke="url(#rx-grad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <!-- 'x' diagonal tail -->
  <path
    d="M22 24.5L33 35.5"
    stroke="url(#rx-grad)"
    stroke-width="3"
    stroke-linecap="round"
    filter="url(#glow)"
  />
  <!-- 'x' cross stroke -->
  <path
    d="M24 34.5L31.5 27"
    stroke="#5eead4"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Glowing Focal Aperture / Medical Dot -->
  <circle cx="34" cy="14" r="3.2" fill="#34d399" filter="url(#glow)" />
  <circle cx="34" cy="14" r="1.3" fill="#ffffff" />
</svg>
