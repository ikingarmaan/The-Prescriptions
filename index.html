    <script>
      // Enterprise Watchdog & Resource Error Handler
      window.__appMounted = false;
      window.__loadErrors = [];

      window.addEventListener('error', function(e) {
        var msg = '';
        if (e.message) {
          msg = e.message;
        } else if (e.target && (e.target.src || e.target.href)) {
          var assetName = (e.target.src || e.target.href).split('/').pop();
          msg = 'Failed to load: ' + assetName;
          // Auto-recover missing chunk if possible
          try {
            var retryKey = 'chunk_retry_' + assetName;
            if (window.sessionStorage && !window.sessionStorage.getItem(retryKey)) {
              window.sessionStorage.setItem(retryKey, '1');
              window.location.href = window.location.pathname + '?reload=' + Date.now();
            }
          } catch (err) {}
        } else {
          msg = 'Network or syntax error during load';
        }
        window.__loadErrors.push(msg);
        var detailEl = document.getElementById('preloader-error-detail');
        if (detailEl) {
          detailEl.textContent = msg;
          detailEl.style.display = 'block';
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason ? (e.reason.message || String(e.reason)) : 'Promise rejected';
        window.__loadErrors.push(msg);
        var detailEl = document.getElementById('preloader-error-detail');
        if (detailEl) {
          detailEl.textContent = msg;
          detailEl.style.display = 'block';
        }
      });

      // Watchdog: If React doesn't mount within 3.5 seconds, display diagnostic box
      setTimeout(function() {
        if (!window.__appMounted) {
          var diag = document.getElementById('preloader-diagnostic');
          if (diag) {
            diag.style.display = 'block';
            if (window.__loadErrors.length > 0) {
              var detailEl = document.getElementById('preloader-error-detail');
              if (detailEl) {
                detailEl.textContent = window.__loadErrors.join(' | ');
                detailEl.style.display = 'block';
              }
            }
          }
        }
      }, 3500);
    </script>
